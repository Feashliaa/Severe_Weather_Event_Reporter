<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generating Report - Severe Weather Event Reporter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
</head>

<body class="bg-[#b0cce8] text-slate-900 min-h-screen">

    <div class="bg-[#003a8c] border-b-4 border-yellow-400">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-yellow-400 text-[#003a8c] font-black px-3 py-1 text-xs tracking-widest"
                    style="font-family: 'Oswald', sans-serif;">SWX</div>
                <div class="text-white text-xs uppercase tracking-widest font-semibold">Severe Weather Event Reporter
                </div>
            </div>
            <div class="flex items-center gap-4">
                <a href="/" class="text-white text-xs uppercase tracking-widest hover:text-yellow-400">New Report</a>
                <a href="/gallery" class="text-white text-xs uppercase tracking-widest hover:text-yellow-400">Previous
                    Reports</a>
            </div>
        </div>
    </div>

    <div class="max-w-5xl mx-auto px-4 py-16 flex flex-col items-center gap-6">
        <div class="bg-white border-2 border-[#003a8c] shadow-[3px_3px_0_rgba(0,58,140,0.15)] w-full max-w-lg">
            <div class="bg-[#003a8c] text-white px-4 py-2 border-b-2 border-yellow-400"
                style="font-family: 'Oswald', sans-serif;">
                <span class="font-bold uppercase tracking-wider text-sm">Generating Report</span>
            </div>
            <div class="p-8 flex flex-col items-center gap-4 text-center">
                <div id="spinner"
                    class="w-10 h-10 border-4 border-[#003a8c] border-t-yellow-400 rounded-full animate-spin"></div>
                <p id="status-msg" class="text-slate-700 text-sm font-mono">
                    Fetching warnings, radar data, and LSRs...
                </p>
                <p class="text-xs text-slate-500">This takes 3-5 minutes. The page will redirect automatically when
                    ready.</p>
            </div>
        </div>

        <div id="error-box" class="hidden w-full max-w-lg border-2 border-red-600 bg-white p-4">
            <p class="font-bold text-red-700 uppercase text-sm mb-2" style="font-family: 'Oswald', sans-serif;">Pipeline
                Failed</p>
            <p id="error-msg" class="text-sm font-mono text-red-700"></p>
            <a href="/"
                class="inline-block mt-4 bg-[#003a8c] text-yellow-400 font-bold uppercase tracking-widest px-4 py-2 text-xs hover:bg-yellow-400 hover:text-[#003a8c] transition-colors"
                style="font-family: 'Oswald', sans-serif;">
                Try Again
            </a>
        </div>
    </div>

    <script>
        const slug = "{{ slug }}";
        const statusMsg = document.getElementById("status-msg");
        const errorBox = document.getElementById("error-box");
        const errorMsg = document.getElementById("error-msg");

        async function poll() {
            try {
                const res = await fetch(`/reports/${slug}/status.json`);
                const data = await res.json();
                if (data.status === "done") {
                    window.location.href = `/reports/${slug}/`;
                } else if (data.status === "failed") {
                    document.getElementById("spinner").classList.add("hidden");
                    statusMsg.classList.add("hidden");
                    errorBox.classList.remove("hidden");
                    errorMsg.textContent = data.error || "Unknown error";
                } else {
                    if (data.message) {
                        statusMsg.textContent = data.message;
                    }
                    setTimeout(poll, 3000);
                }
            } catch {
                setTimeout(poll, 3000);
            }
        }

        poll();
    </script>
</body>

</html>
