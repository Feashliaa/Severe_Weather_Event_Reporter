<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generating Report - Severe Weather Event Reporter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

</head>

<body class="bg-[#b0cce8] text-slate-900 min-h-screen flex flex-col">

    <div class="bg-[#003a8c] border-b-4 border-yellow-400">
        <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-yellow-400 text-[#003a8c] font-black px-3 py-1 text-xs tracking-widest"
                    style="font-family: 'Oswald', sans-serif;">SWX</div>
                <div class="text-white text-xs uppercase tracking-widest font-semibold">Severe Weather Event Reporter
                </div>
            </div>
            <div class="flex items-center gap-4">
                <a href="/" class="text-white text-xs uppercase tracking-widest hover:text-yellow-400">New Report</a>
                <a href="/gallery" class="text-white text-xs uppercase tracking-widest hover:text-yellow-400">Previous
                    Reports</a>
            </div>
        </div>
    </div>

    <div class="max-w-5xl mx-auto px-4 py-16 flex flex-col items-center gap-6">
        <div class="bg-white border-2 border-[#003a8c] shadow-[3px_3px_0_rgba(0,58,140,0.15)] w-full max-w-lg">
            <div class="bg-[#003a8c] text-white px-4 py-2 border-b-2 border-yellow-400"
                style="font-family: 'Oswald', sans-serif;">
                <span class="font-bold uppercase tracking-wider text-sm">Generating Report</span>
            </div>
            <div class="p-8 flex flex-col items-center gap-4 text-center">
                <div id="spinner"
                    class="w-10 h-10 border-4 border-[#003a8c] border-t-yellow-400 rounded-full animate-spin"></div>
                <p id="status-msg" class="text-slate-700 text-sm font-mono">
                    Starting pipeline...
                </p>

                <!-- Progress bar -->
                <div class="w-full bg-slate-200 border border-slate-300 h-3">
                    <div id="progress-bar" class="bg-[#003a8c] h-3 transition-all duration-1000" style="width: 0%">
                    </div>
                </div>
                <p id="progress-label" class="text-xs text-slate-500 font-mono">0%</p>

                <!-- Bottom estimate -->
                <p id="time-estimate" class="text-xs text-slate-400">
                    Estimating time...
                </p>
            </div>

            <div id="error-box" class="hidden border-t-2 border-red-600 bg-red-50 px-6 py-4">
                <p class="text-sm font-bold text-red-700 uppercase tracking-wider">Pipeline Failed</p>
                <p id="error-msg" class="text-xs text-red-600 font-mono mt-1"></p>
                <button id="retry-btn"
                    class="mt-3 bg-[#003a8c] text-white text-xs uppercase tracking-wider font-bold px-4 py-2 border-2 border-[#003a8c] hover:bg-yellow-400 hover:text-[#003a8c] transition-colors"
                    style="font-family: 'Oswald', sans-serif;">
                    Retry Report
                </button>
            </div>
        </div>
    </div>

    <script>

        const retryBtn = document.getElementById("retry-btn");

        retryBtn.addEventListener("click", async () => {
            retryBtn.disabled = true;
            retryBtn.textContent = "Retrying...";
            try {
                const res = await fetch(`/reports/${slug}/retry`, { method: "POST" });
                if (!res.ok) throw new Error(`Retry failed (${res.status})`);
                // Reset UI to running state
                errorBox.classList.add("hidden");
                document.getElementById("spinner").classList.remove("hidden");
                statusMsg.classList.remove("hidden");
                statusMsg.textContent = "Restarting pipeline...";
                progressBar.style.width = "0%";
                progressLabel.textContent = "0%";
                startTime = Date.now();
                estimatedSeconds = null;
                retryBtn.disabled = false;
                retryBtn.textContent = "Retry Report";
                poll();
            } catch (e) {
                retryBtn.disabled = false;
                retryBtn.textContent = "Retry Report";
                errorMsg.textContent = "Retry failed: " + e.message;
            }
        });
        
        const slug = "{{ slug }}";
        const statusMsg = document.getElementById("status-msg");
        const errorBox = document.getElementById("error-box");
        const errorMsg = document.getElementById("error-msg");
        const progressBar = document.getElementById("progress-bar");
        const progressLabel = document.getElementById("progress-label");
        const timeEstimate = document.getElementById("time-estimate");

        let startTime = Date.now();
        let estimatedSeconds = null;

        function updateProgress() {
            if (!estimatedSeconds) return;
            const elapsed = (Date.now() - startTime) / 1000;
            const pct = Math.min(95, Math.round((elapsed / estimatedSeconds) * 100));
            progressBar.style.width = pct + "%";
            progressLabel.textContent = pct + "%";

            const remaining = Math.max(0, Math.ceil((estimatedSeconds - elapsed) / 60 * 10) / 10);
            if (remaining < 1) {
                timeEstimate.textContent = `Less than a minute remaining...`;
            } else {
                timeEstimate.textContent = `~${Math.ceil(remaining)} minute${Math.ceil(remaining) !== 1 ? 's' : ''} remaining`;
            }
        }

        // Tick every second
        setInterval(updateProgress, 1000);

        async function poll() {
            try {
                const res = await fetch(`/reports/${slug}/status.json`);
                const data = await res.json();

                if (data.status === "done") {
                    progressBar.style.width = "100%";
                    progressLabel.textContent = "100%";
                    timeEstimate.textContent = "Complete — redirecting...";
                    window.location.href = `/reports/${slug}/`;
                } else if (data.status === "failed") {
                    document.getElementById("spinner").classList.add("hidden");
                    statusMsg.classList.add("hidden");
                    errorBox.classList.remove("hidden");
                    errorMsg.textContent = data.error || "Unknown error";
                } else {
                    if (data.estimated_seconds && !estimatedSeconds) {
                        estimatedSeconds = data.estimated_seconds;
                        const mins = Math.ceil(estimatedSeconds / 60);
                        timeEstimate.textContent = `Estimated ~${mins} minutes total`;
                    }
                    if (data.message) {
                        statusMsg.textContent = data.message;
                    }
                    setTimeout(poll, 3000);
                }
            } catch {
                setTimeout(poll, 3000);
            }
        }

        poll();
    </script>
